tical-align:middle\">        2050年全球將有七成的人居住在城市，城市必須供養70億人口，但密集開發的城市哪還有多餘的土地可耕作？為解決城市糧食供應的問題，垂直農場應運而生。<\/p><p>城市垂直農場是把水平的農場，改造成種滿植物的摩天大樓，用營養液代替土壤，用LED燈取代陽光，這些彷彿科幻小說的情節，在專家的努力下正一步步成真。垂直農法在密閉的室內種植農作物，壓縮了空間，讓效益極大化，節約土地也節約用水量，用水僅是傳統土壤種植的十分之一。而樓上種菜、樓下賣菜的經營方式，縮短了食物里程，減少了長途運送的資源浪費。<\/p><p>        垂直農場發想者的本意在解決全人類的問題，然而這種耕作方法現階段仍有個無法克服的難關，就是生產成本太高。目前只能為少數人服務，無法養活全世界。全球人口稠密的城市，有四分之三分布在<u>亞洲<\/u>，因此相較其他地方，<u>亞洲<\/u>的大都市更加支持垂直農場的發展。<\/p><p>──改寫自〈未來城市──垂直農場〉<\/p><p>【乙】<\/p><p><img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-3d046512f3f0e2fa298e.jpg\" alt=\"來源圖像 image17.jpeg\" style=\"width:242.3px;max-width:100%;height:auto;vertical-align:middle\">        <u>荷蘭<\/u>某業者耗鉅資三億<u>歐<\/u>元，打造全球第一座海岸漂浮牧場。業者認為把牧場搬到城市的河岸或海岸線，一來節能減碳，二來也為氣候變遷海平面上升、土地減少的問題找到解決之道。<\/p><p>這座位於<u>鹿特丹<\/u>港邊的建築，可說是<u>荷蘭<\/u>循環經濟的展示間。它的屋頂可收集雨水，旁邊的太陽能面板，可提供整棟建築所需的四成電力。①<u>上層的空間可容納<\/u><u>40<\/u><u>頭乳牛，一天約產出<\/u><u>800<\/u><u>公升的鮮奶<\/u>，②<u>乳牛的飼料來自當地高爾夫球場、運動場修剪後的草屑以及啤酒廠用過的穀物、麩<\/u>，全部自動收割混合後，再定時、定量送到乳牛面前。③<u>連擠牛奶和清理排泄物的工作，也都由機器代勞<\/u>，且乳牛的排泄物會被回收再製成肥料。樓層中設有加工區，④<u>可直接將乳製品銷往當地，減少運輸成本<\/u>。參觀者也可在現場按下開關直接購買未經高溫消毒的鮮奶。<\/p><p>        但也有研究人員指出這種模式可能較適合用在農業而非畜牧業。「乳牛應該在自然棲息地漫步。現在把牠們搬到非常工業化的環境，對許多人而言，會認為這不是對待牠們應有的方式。」<\/p><p>──改寫自〈鹿特丹海岸漂浮牧場落成開放參觀〉<\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>根據甲文，下列關於垂直農場的推論，何者最恰當？<\/p><p>(A)產量與用水量皆高出土壤種植方式<\/p><p>(B)受天然風災直接的影響少於傳統農業<\/p><p>(C)<u>亞洲<\/u>因生產成本較低，更適合垂直農場的發展<\/p><p>(D)2050年全球將有七成的人必須吃垂直農場栽種的蔬菜<\/p><\/div>","note":"來源：423501_國文科試題分析_國民中學版.docx"},"teaching":null},{"qid":"27","number":27,"kind":"choice","target":"能應用文本","ability":"文本評鑑","basis":["學習表現：5-Ⅳ-4","學習內容：Ad-Ⅳ-2"],"answer":"B","school":0.86,"national":0.87,"city":0.91,"deltaNational":-0.01,"deltaCity":-0.05,"groups":{"全體":{"n":187,"rate":0.861,"counts":{"blank":0,"multiple":0,"A":11,"B":161,"C":8,"D":7},"maxWrongRate":0.058823529411764705,"maxWrongOptions":["A"],"highWrongOptions":[]},"精熟":{"n":29,"rate":1,"counts":{"blank":0,"multiple":0,"A":0,"B":29,"C":0," 54011,"maxWrongOptions":["A"],"highWrongOptions":[]},"精熟":{"n":29,"rate":0.9655,"counts":{"blank":0,"multiple":0,"A":0,"B":1,"C":0,"D":28},"maxWrongRate":0.034482758620689655,"maxWrongOptions":["B"],"highWrongOptions":[]},"基礎":{"n":127,"rate":0.9134,"counts":{"blank":0,"multiple":0,"A":6,"B":2,"C":3,"D":116},"maxWrongRate":0.047244094488188976,"maxWrongOptions":["A"],"highWrongOptions":[]},"待加強":{"n":31,"rate":0.4194,"counts":{"blank":0,"multiple":0,"A":7,"B":4,"C":7,"D":13},"maxWrongRate":0.22580645161290322,"maxWrongOptions":["A","C"],"highWrongOptions":["A","C"]}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><p><br>請閱讀以下文章，並回答30～32題：<\/p><table class=\"source-table\"><tr><td><p>　　親愛的<u>馬爾萬<\/u>，在我童年的漫長夏天裡，那時我跟你現在一樣大，你叔叔們和我會在你爺爺的農舍屋頂上鋪開床墊，那是在<u>霍姆斯<\/u>城郊外。<\/p><p>　　<u>馬爾萬<\/u>，①<u>我希望你和我一樣記住霍姆斯<\/u>。在它繁華的老城，有一座我們<u>穆斯林<\/u>的清真寺，一座我們<u>基督<\/u>徒鄰居的教堂，還有一座我們所有人的大市場，我們在那裡為金項鍊和新鮮食材以及新娘禮服討價還價。<\/p><p>　　我希望你記得那滿是炸羊肉丸子味道的擁擠小巷，還有那些晚上，②<u>我們和你媽媽一起在鐘樓廣場附近散步<\/u>。但是那樣的生活，那個時候，現在看來都像是夢，就算對我來說，都像消失很久的傳聞。<\/p><p>　　先是抗議示威，然後是被圍困。天空布滿炸彈，到處是飢餓的人民，與接連不斷的葬禮，這些你是知道的。你知道的那些母親們、姊妹們和同學們有可能被埋在水泥、磚塊和外露的房梁間的狹窄細縫裡，陽光照射下的小塊皮膚在黑暗中閃閃發光。<\/p><p>　　你媽媽今晚也在這裡，<u>馬爾萬<\/u>，和我們在一起。在這寒冷的月光照耀的海灘上，在啼哭的嬰兒中間，在憂慮地說著我們不會講的語言的女人中間。<u>阿富汗<\/u>人、<u>索馬利亞<\/u>人、<u>伊拉克<\/u>人還有<u>敘利亞<\/u>人，我們所有人都在焦急地等待日出，所有人又在害怕日出，我們所有人都在尋找家園。<\/p><p>　　我聽說我們是不速之客，我們是不受歡迎的，我們應該把災禍帶到別處去。但我聽到了你媽媽的聲音，越過潮水，她在我耳邊低語：「噢，如果他們看見，親愛的，哪怕只有你所見的一半，只要他們能看見，他們一定會說出善意的話的。」<\/p><p>　　我看見你的側臉，在下弦月的光輝中，我的孩子，你的睫毛就像<u>阿拉伯<\/u>書法一樣，在你沉靜的睡眠中緊閉著。我對你說：「抓住我的手，不會有壞事發生。」<\/p><p>　　我今夜能想到的，是海有多深，多寬廣，多冷漠。我是多麼無能為力，沒能在它面前保護好你。我能做的就是祈禱，祈禱真主讓船航行在正確的方向。③<u>當海岸退出視野，我們只是波濤中的一個小點<\/u>，一旦絆倒或站不穩，很容易就會被吞沒。<\/p><p>　　因為你，是珍貴的船貨，<u>馬爾萬<\/u>。④<u>有史以來最珍貴的船貨<\/u>。<\/p><p>　　我多麼希望大海能明白這一點。<\/p><p>——改寫自<u>卡勒德<\/u><u>．<\/u><u>胡賽尼<\/u>《海的祈禱》<\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>根據本文，畫線處的文句何者最能看出爸爸對孩子的重視？<\/p><p>(A) ①<\/p><p>(B) ②<\/p><p>(C) ③<\/p><p>(D) ④<\/p><\/div>","note":"來源：423501_國文科試題分析_國民中學版.docx"},"teaching" 史以來最珍貴的船貨<\/u>。<\/p><p>　　我多麼希望大海能明白這一點。<\/p><p>——改寫自<u>卡勒德<\/u><u>．<\/u><u>胡賽尼<\/u>《海的祈禱》<\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>本文中的「我」和<u>馬爾萬<\/u>，身分最可能是下列何者？<\/p><p>(A)移民到<u>阿拉伯半島<\/u>的<u>基督<\/u>徒<\/p><p>(B)為戰亂國家運送物資的船員<\/p><p>(C)來自戰爭地區的<u>穆斯林<\/u>難民<\/p><p>(D)幫災民遠離砲火摧殘的善人<\/p><\/div>","note":"來源：423501_國文科試題分析_國民中學版.docx"},"teaching":null},{"qid":"32","number":32,"kind":"choice","target":"能分析文本的寫作手法","ability":"文本評鑑","basis":["學習表現：5-Ⅳ-3","學習內容：Ad-Ⅳ-2"],"answer":"A","school":0.42,"national":0.51,"city":0.61,"deltaNational":-0.09,"deltaCity":-0.19,"groups":{"全體":{"n":187,"rate":0.4225,"counts":{"blank":0,"multiple":0,"A":79,"B":19,"C":62,"D":27},"maxWrongRate":0.3315508021390374,"maxWrongOptions":["C"],"highWrongOptions":["C"]},"精熟":{"n":29,"rate":0.7931,"counts":{"blank":0,"multiple":0,"A":23,"B":1,"C":3,"D":2},"maxWrongRate":0.10344827586206896,"maxWrongOptions":["C"],"highWrongOptions":[]},"基礎":{"n":127,"rate":0.3701,"counts":{"blank":0,"multiple":0,"A":47,"B":11,"C":50,"D":19},"maxWrongRate":0.3937007874015748,"maxWrongOptions":["C"],"highWrongOptions":["C"]},"待加強":{"n":31,"rate":0.2903,"counts":{"blank":0,"multiple":0,"A":9,"B":7,"C":9,"D":6},"maxWrongRate":0.2903225806451613,"maxWrongOptions":["C"],"highWrongOptions":["B","C"]}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><p><br>請閱讀以下文章，並回答30～32題：<\/p><table class=\"source-table\"><tr><td><p>　　親愛的<u>馬爾萬<\/u>，在我童年的漫長夏天裡，那時我跟你現在一樣大，你叔叔們和我會在你爺爺的農舍屋頂上鋪開床墊，那是在<u>霍姆斯<\/u>城郊外。<\/p><p>　　<u>馬爾萬<\/u>，①<u>我希望你和我一樣記住霍姆斯<\/u>。在它繁華的老城，有一座我們<u>穆斯林<\/u>的清真寺，一座我們<u>基督<\/u>徒鄰居的教堂，還有一座我們所有人的大市場，我們在那裡為金項鍊和新鮮食材以及新娘禮服討價還價。<\/p><p>　　我希望你記得那滿是炸羊肉丸子味道的擁擠小巷，還有那些晚上，②<u>我們和你媽媽一起在鐘樓廣場附近散步<\/u>。但是那樣的生活，那個時候，現在看來都像是夢，就算對我來說，都像消失很久的傳聞。<\/p><p>　　先是抗議示威，然後是被圍困。天空布滿炸彈，到處是飢餓的人民，與接連不斷的葬禮，這些你是知道的。你知道的那些母親們、姊妹們和同學們有可能被埋在水泥、磚塊和外露的房梁間的狹窄細縫裡，陽光照射下的小塊皮膚在黑暗中閃閃發光。<\/p><p>　　你媽媽今晚也在這裡，<u>馬爾萬<\/u>，和我們在一起。在這寒冷的月光照耀的海灘上，在啼哭的嬰兒中間，在憂慮地說著我們不會講的語言的女人中間。<u>阿富汗<\/u>人、<u>索馬利亞<\/u>人、<u>伊拉克<\/u>人還有 章寫得非常漂亮，遠遠超過別的翰林待詔，皇帝喊你喊得特別頻繁，今天讓你寫這個，明天讓你寫那個，甚至讓你幫他處理奏章，那麼你就成了翰林供奉。<\/p><p>翰林學士又是翰林供奉裡的佼佼者，不光文筆一流，還通曉政治。朝廷把這批人才從待詔和供奉裡發掘出來，讓他們單獨辦公。<\/p><p>不管是翰林待詔、翰林供奉，還是翰林學士，都沒有專門的品級。不過翰林學士一般兼有其他職務，既是翰林學士，又是戶部尚書、禮部尚書、兵部侍郎、吏部侍郎等等。雖然翰林學士不領薪水，但是尚書、侍郎卻有不菲的薪水。翰林待詔和翰林供奉大都不兼職，可是他們卻有薪水，其中翰林待詔的薪水參照九品京官，翰林供奉的薪水參照八品京官。<\/p><p>——改寫自<u>李開周<\/u>〈翰林的薪水〉<\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>關於文中翰林供奉的敘述，下列何者最恰當？<\/p><p>(A)可獨立辦公<\/p><p>(B)有很多兼職收入<\/p><p>(C)薪水比照八品京官<\/p><p>(D)不能幫皇帝處理奏章<\/p><\/div>","note":"來源：423501_國文科試題分析_國民中學版.docx"},"teaching":null},{"qid":"34","number":34,"kind":"choice","target":"能根據文本推論","ability":"文意理解","basis":["學習表現：5-Ⅳ-3","學習內容：Ad-Ⅳ-2"],"answer":"B","school":0.78,"national":0.77,"city":0.84,"deltaNational":0.01,"deltaCity":-0.06,"groups":{"全體":{"n":187,"rate":0.7754,"counts":{"blank":0,"multiple":0,"A":17,"B":145,"C":18,"D":7},"maxWrongRate":0.0962566844919786,"maxWrongOptions":["C"],"highWrongOptions":[]},"精熟":{"n":29,"rate":1,"counts":{"blank":0,"multiple":0,"A":0,"B":29,"C":0,"D":0},"maxWrongRate":0,"maxWrongOptions":["A","C","D"],"highWrongOptions":[]},"基礎":{"n":127,"rate":0.8425,"counts":{"blank":0,"multiple":0,"A":9,"B":107,"C":7,"D":4},"maxWrongRate":0.07086614173228346,"maxWrongOptions":["A"],"highWrongOptions":[]},"待加強":{"n":31,"rate":0.2903,"counts":{"blank":0,"multiple":0,"A":8,"B":9,"C":11,"D":3},"maxWrongRate":0.3548387096774194,"maxWrongOptions":["C"],"highWrongOptions":["A","C"]}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><p><br>請閱讀以下短文，並回答33～34題：<\/p><table class=\"source-table\"><tr><td><p><u>唐玄宗<\/u>時，翰林有三種：翰林待詔、翰林供奉、翰林學士。<\/p><p>翰林待詔這個群體很雜，有詩人，有畫家，有經學家，有書法家，有醫生，還有算命先生。這些人被<u>唐玄宗<\/u>包養起來，辦公之餘，或者出遊的時候，把他們喊過去，陪著玩耍，說穿了，就是「幫閒」。<\/p><p>翰林供奉是翰林待詔裡的佼佼者，譬如說，你寫文章寫得非常漂亮，遠遠超過別的翰林待詔，皇帝喊你喊得特別頻繁，今天讓你寫這個，明天讓你寫那個，甚至讓你幫他處理奏章，那麼你就成了翰林供奉。<\/p><p>翰林學士又是翰林供奉裡的佼佼者，不光文筆一流，還通曉政治。朝廷把這批人才從待詔和供奉裡發掘出來，讓他們單獨辦公。<\/p><p>不管是翰林待詔、翰林供奉，還是翰林學士，都沒有專門的品級。不過翰林學士一般兼有其他職務，既是翰林學士，又是戶部尚書、禮部尚書、兵部侍郎、吏部侍郎等等。雖然翰林學士不領薪水，但是尚書、侍郎卻有不菲的薪水。翰林待詔和翰林供奉大都不兼職，可是他們卻有薪水，其中翰林待詔的薪水參照九品京官，翰林供奉的薪水參照八品京官。<\/p><p>——改寫自<u>李開周<\/u>〈翰林的薪水〉<\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>根據本文，下列推論何者最恰當？<\/p><p>(A)尚書和侍郎通常也兼任翰林供奉<\/p><p>(B)翰林學士處理政務的能力優於翰林供奉<\/p><p>(C)翰林待詔是<u>唐玄宗<\/u>重要的行政幕僚之一<\/p><p>(D)翰林待詔與翰林學士的差別在專門品級的高低<\/p><\/div>","note":"來源：423501_國文科試題分析_國民中學版.docx"},"teaching":null},{"qid":"35","number":35,"kind":"choice","target":"能理解文意","ability":"文意理解","basis":["學習表現：5-Ⅳ-3","學習內容：Ad-Ⅳ-2"],"answer":"C","school":0.71,"national":0.71,"city":0.8,"deltaNational":0,"deltaCity":-0.09,"groups":{"全體":{"n":187,"rate":0.7059,"counts":{"blank":0,"multiple":0,"A":8,"B":20,"C":132,"D":27},"maxWrongRate":0.1443850267379679,"maxWrongOptions":["D"],"highWrongOptions":[]},"精熟":{"n":29,"rate":0.931,"counts":{"blank":0,"multiple":0,"A":0,"B":2,"C":27,"D":0},"maxWrongRate":0.06896551724137931,"maxWrongOptions":["B"],"highWrongOptions":[]},"基礎":{"n":127,"rate":0.7402,"counts":{"blank":0,"multiple":0,"A":1,"B":9,"C":94,"D":23},"maxWrongRate":0.18110236220472442,"maxWrongOptions":["D"],"highWrongOptions":[]},"待加強":{"n":31,"rate":0.3548,"counts":{"blank":0,"multiple":0,"A":7,"B":9,"C":11,"D":4},"maxWrongRate":0.2903225806451613,"maxWrongOptions":["B"],"highWrongOptions":["A","B"]}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><p><br>請閱讀以下資料，並回答35～36題：<\/p><p><img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9e0a723bcb72938e24df.jpg\" alt=\"來源圖像 image18.jpeg\" style=\"width:598.2px;max-width:100%;height:auto;vertical-align:middle\"> <\/p><\/section><div class=\"source-question-part\"><p>題目<\/p><p>根據本文，下列關於投壺的敘述何者最恰當？<\/p><p>(A)主人要讓分給客人<\/p><p>(B)由先<u>秦<\/u>的娛樂競技演變而來<\/p><p>(C)參賽者各以四箭算一局勝負<\/p><p>(D)司正以三局分數的總和判定贏家<\/p><\/div>","note":"來源：423501_國文科試題分析_國民中學版.docx"},"teaching":null},{"qid":"36","number":36,"kind":"choice","target":"能應用文本","ability":"文本評鑑","basis":["學習表現：5-Ⅳ-4","學習內容：Bc-Ⅳ-3"],"answer":"C","school":0.76,"national":0.79,"city":0.85,"deltaN :{"n":29,"rate":1,"counts":{"blank":0,"multiple":0,"A":0,"B":0,"C":29,"D":0},"maxWrongRate":0,"maxWrongOptions":["A","B","D"],"highWrongOptions":[]},"基礎":{"n":127,"rate":0.8661,"counts":{"blank":0,"multiple":0,"A":3,"B":10,"C":110,"D":4},"maxWrongRate":0.07874015748031496,"maxWrongOptions":["B"],"highWrongOptions":[]},"待加強":{"n":31,"rate":0.3871,"counts":{"blank":0,"multiple":0,"A":1,"B":11,"C":12,"D":7},"maxWrongRate":0.3548387096774194,"maxWrongOptions":["B"],"highWrongOptions":["B","D"]}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><p><br>請閱讀以下短文，並回答37～38題：<\/p><table class=\"source-table\"><tr><td><p>        <u>東非<\/u>草原上，鐮莢金合歡樹提供原生舉尾蟻花蜜與住所，而舉尾蟻會保護金合歡免受食草性動物侵害，並攻擊啃食金合歡的<u>非洲<\/u>象。21世紀初，外來的熱帶大頭家蟻突然出現在<u>肯亞<\/u>，牠們會殺死舉尾蟻並吃掉其幼體，讓<u>非洲<\/u>象得以肆無忌憚地啃食金合歡。<\/p><p>        另一方面，金合歡減少，也令獅子在捕獵斑馬時難以掩蔽。研究團隊為了解金合歡減少是否會影響獅子獵食，在<u>肯亞<\/u>保護區的稀樹草原上建立十幾個研究區塊，追蹤金合歡景觀變化、斑馬族群密度、熱帶大頭家蟻出現情況以及獅子殺死斑馬的情況。<\/p><p>        經過3年的監測，團隊發現沒有舉尾蟻的金合歡被<u>非洲<\/u>象破壞的速度，比有舉尾蟻的樹快5～7倍。這些區域的金合歡覆蓋面積急劇減少，使獅子很難偷偷靠近並伏擊斑馬。而沒有熱帶大頭家蟻入侵的地區，斑馬遭獅子獵殺的情況較前者高出兩倍以上。<\/p><p>        令人驚訝的是，雖然接觸主要獵物的機會減少，但研究區域的獅子數量卻保持穩定。根據其他研究數據，團隊發現當地獅子另外增加捕獵的對象：從2003年到2020年，獅子獵殺斑馬的比例從67%下降到42%，而獵殺水牛的比例從0%增加到42%。<\/p><p>針對這樣的結果，專家認為：這些入侵的螞蟻可能早就出現，但沒有人注意。我們現在發現牠們以非常微妙的方式改變了生態景觀。<\/p><p>——改寫自《Science》2024年1月號<\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>根據本文，關於熱帶大頭家蟻入侵<u>肯亞<\/u>保護區後的生態變化，下列敘述何者最恰當？<\/p><p>(A)獅子數量減少<\/p><p>(B)斑馬易受獅子攻擊<\/p><p>(C)金合歡易受大象破壞<\/p><p>(D)舉尾蟻不再攻擊大象<\/p><\/div>","note":"來源：423501_國文科試題分析_國民中學版.docx"},"teaching":null},{"qid":"38","number":38,"kind":"choice","target":"能根據文本推論","ability":"文意理解","basis":["學習表現：5-Ⅳ-3","學習內容：Bc-Ⅳ-1"],"answer":"A","school":0.68,"national":0.73,"city":0.82,"deltaNational":-0.05,"deltaCity":-0.14,"groups":{"全體":{"n":187,"rate":0.6791,"counts":{"blank":0,"multiple":0,"A":127,"B":10,"C":31,"D":19},"maxWrongRate":0.1657754010695187,"maxWrongOptions":["C"],"highWrongOptions":[]},"精熟":{"n":29,"rate":0.931,"counts":{"blank":0,"mult 1～42題：<\/p><table class=\"source-table\"><tr><td><p>　　<u>田饒<\/u>事<u>魯哀公<\/u>，而不見察。謂<u>哀公<\/u>曰：「臣將去君，黃鵠舉矣。」<u>哀公<\/u>曰：「何謂也？」<u>田饒<\/u>曰：「君獨不見夫雞乎？頭戴冠者，文也；足傅距<sub>1<\/sub>者，武也；敵在前敢鬥者，勇也；見食相告者，仁也；守夜不失時者，信也。雞雖有此五德，君猶烹而食之者，何也？則以其所從來者近也。夫黃鵠一舉千里，止君園池，食君魚鱉，啄君黍粱，無此五德，君猶貴之者，何也？以其所從來者遠也。臣將去君，黃鵠舉矣。」遂去之<u>燕<\/u>，<u>燕<\/u>以為相，三年，<u>燕<\/u>政大平。<\/p><p>——改寫自<u>韓嬰<\/u>《韓詩外傳》<\/p><\/td><\/tr><\/table><p><div class=\"source-textbox\"><p>&amp;<\/p><p>1.足傅距：腳上長著爪子<\/p><\/div><\/p><\/section><div class=\"source-question-part\"><p>題目<\/p><p>下列文句「」中文字的解釋，何者最恰當？<\/p><p>(A)<u>田饒<\/u>事<u>魯哀公<\/u>，而「不見察」：不懂得自我反省<\/p><p>(B)「見食相告」者，仁也：看到食物就通知夥伴<\/p><p>(C)夫黃鵠「一舉千里」：高踞樹頂，眼界開闊<\/p><p>(D)「遂去之<u>燕<\/u>」，<u>燕<\/u>以為相：離開了<u>燕國<\/u><\/p><\/div>","note":"來源：423501_國文科試題分析_國民中學版.docx"},"teaching":null},{"qid":"42","number":42,"kind":"choice","target":"能理解文意","ability":"文意理解","basis":["學習表現：5-Ⅳ-3","學習內容：Ad-Ⅳ-4"],"answer":"B","school":0.35,"national":0.35,"city":0.44,"deltaNational":0,"deltaCity":-0.09,"groups":{"全體":{"n":187,"rate":0.3476,"counts":{"blank":1,"multiple":0,"A":41,"B":65,"C":45,"D":35},"maxWrongRate":0.24064171122994651,"maxWrongOptions":["C"],"highWrongOptions":["A","C"]},"精熟":{"n":29,"rate":0.7241,"counts":{"blank":0,"multiple":0,"A":3,"B":21,"C":1,"D":4},"maxWrongRate":0.13793103448275862,"maxWrongOptions":["D"],"highWrongOptions":[]},"基礎":{"n":127,"rate":0.2992,"counts":{"blank":1,"multiple":0,"A":27,"B":38,"C":38,"D":23},"maxWrongRate":0.2992125984251969,"maxWrongOptions":["C"],"highWrongOptions":["A","C"]},"待加強":{"n":31,"rate":0.1935,"counts":{"blank":0,"multiple":0,"A":11,"B":6,"C":6,"D":8},"maxWrongRate":0.3548387096774194,"maxWrongOptions":["A"],"highWrongOptions":["A","D"]}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><p><br>請閱讀以下短文，並回答41～42題：<\/p><table class=\"source-table\"><tr><td><p>　　<u>田饒<\/u>事<u>魯哀公<\/u>，而不見察。謂<u>哀公<\/u>曰：「臣將去君，黃鵠舉矣。」<u>哀公<\/u>曰：「何謂也？」<u>田饒<\/u>曰：「君獨不見夫雞乎？頭戴冠者，文也；足傅距<sub>1<\/sub>者，武也；敵在前敢鬥者，勇也；見食相告者，仁也；守夜不失時者，信也。雞雖有此五德，君猶烹而食之者，何也？則以其所從來 const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));


const finite = value => typeof value === 'number' && Number.isFinite(value);


const fixed = value => finite(value) ? value.toFixed(4) : null;


const rate = value => finite(value) ? value.toFixed(4) : '<span class="missing">未提供</span>';


const percent = value => finite(value) ? (value * 100).toFixed(2) + '%' : '未提供';


const mean = values => {const good=values.filter(finite);return good.length ? good.reduce((a,b)=>a+b,0)/good.length : null;};


const pp = value => finite(value) ? `<span class="${value < -1e-10 ? 'value-neg' : value > 1e-10 ? 'value-pos' : 'value-zero'}">${value>1e-10?'+':''}${(Math.abs(value)<1e-10?0:value*100).toFixed(2)}<span class="pp">％</span></span>` : '<span class="missing">未提供</span>';


const subjects = Array.isArray(DATA.subjects) ? DATA.subjects : [];


const state = {subject:subjects[0]?.id, group:subjects[0]?.groups?.find(g=>g.name==='全體')?.name || subjects[0]?.groups?.[0]?.name || '全體', baseline:'national', mode:'all',sort:'qid'};


const current = () => subjects.find(s=>s.id===state.subject) || subjects[0];


const choices = subject => (subject.items||[]).filter(i=>i.kind!=='constructed');


const groupData = item => item.groups?.[state.group] || null;


const optionKeys = subject => subject.id==='listening' ? ['A','B','C'] : ['A','B','C','D'];


const wrongStats = (subject,item,groupName=state.group) => {


 const group=item.groups?.[groupName];


 if(!group || !finite(group.n) || group.n<=0 || !group.counts)return {max:null,options:[],high:[],advantage:[],review:false,exception:false};


 const wrong=optionKeys(subject).filter(k=>k!==item.answer).map(k=>({key:k,count:group.counts[k],rate:finite(group.counts[k])?group.counts[k]/group.n:null})).filter(o=>finite(o.rate));


 const max=wrong.length?Math.max(...wrong.map(o=>o.rate)):null;


 const options=wrong.filter(o=>o.rate>0&&Math.abs(o.rate-max)<1e-12).map(o=>o.key),high=wrong.filter(o=>o.rate>0.2);


 const advantage=['national','city'].filter(b=>finite(difference(item,b))&&difference(item,b)>=0.10);


 const exception=advantage.length>0&&finite(max)&&max>0&&high.length===0;


 return {max,options,high,advantage,review:high.length>0||exception,exception};


};


const difference = (item,baseline) => finite(item.school)&&finite(item[baseline]) ? (baseline==='city'?item.deltaCity:item.deltaNational) : null;


const baselineName = () => state.baseline==='city'?'臺北市':'全國';


const compareItems = (subject,baseline=state.baseline) => choices(subject).filter(i=>finite(i.school)&&finite(i[baseline]));


const hasCompare = (subject,baseline) => compareItems(subject,baseline).length>0;


const sourceName = subject => typeof subject.sourceFile==='string'?subject.sourceFile:(subject.sourceFile?.name||'');


function chooseSubject(id,scroll=false){


 const subject=subjects.find(s=>s.id===id);if(!subject)return;


 state.subject=id;state.group=subject.groups?.find(g=>g.name==='全體')?.name||subject.groups?.[0]?.name||'全體';state.mode='all';state.sort='qid';


 state.baseline=hasCompare(subject,'national')?'national':hasCompare(subject,'city')?'city':'national';render();


 if(scroll)document.getElementById('subject-history').scrollIntoView({behavior:'smooth',block:'start'});


}


function renderOverview(){


 document.getElementById('overview').innerHTML=subjects.map(subject=>{


 const summary=subject.summary||{},val=finite(summary.meanSchool)?summary.meanSchool:mean(choices(subject).map(i=>i.school));


 const benchmarks=[finite(summary.meanNational)?'全國 '+percent(summary.meanNational):'',finite(summary.meanCity)?'臺北市 '+percent(summary.meanCity):''].filter(Boolean).join(' · ');


 const gaps=[['national','學校平均－全國平均',summary.meanNational],['city','學校平均－全縣市平均',summary.meanCity]].map(([key,label,benchmark])=>`<div class="overview-gap" data-gap="${key}"><span>${label}</span><strong>${(key==='national'||key==='city')&&finite(benchmark)?'約 ':''}${pp(finite(val)&&finite(benchmark)?val-benchmark:null)}</strong></div>`).join('');


 return `<button class="overview-card ${subject.id===state.subject?'active':''}" type="button" data-subject="${esc(subject.id)}" aria-pressed="${subject.id===state.subject}"><div class="overview-head"><strong>${esc(subject.name)}</strong><span class="overview-count">${choices(subject).length} 題選擇題</span></div><div class="overview-value number">${percent(val)}<small>學校逐題均值</small></div><div class="rate-track" aria-hidden="true"><span style="width:${finite(val)?Math.max(0,Math.min(100,val*100)):0}%"></span></div><div class="scale" aria-hidden="true"><span>0%</span><span>100%</span></div><div class="overview-benchmarks">${benchmarks||'外部比較資料：未提供'}</div><div class="overview-gaps">${gaps}</div></button>`;


 }).join('');


 document.querySelectorAll('[data-subject]').forEach(b=>b.addEventListener('click',()=>chooseSubject(b.dataset.subject,true)));


 document.getElementById('subject-tabs').innerHTML=subjects.map(subject=>`<button type="button" role="tab" aria-selected="${subject.id===state.subject}" data-tab="${esc(subject.id)}">${esc(subject.name)}</button>`).join('');


 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>chooseSubject(b.dataset.tab)));


}


const abilityLabel = item => typeof item.ability==='string' && item.ability.trim() ? item.ability.trim() : '分項能力未提供';


const abilityOrder = subject => [...new Set([...(subject.abilityOrder||[]),...choices(subject).map(abilityLabel).filter(x=>x!=='分項能力未提供')])];


function abilityCompare(subject,a,b){


 const order=abilityOrder(subject),rank=i=>abilityLabel(i)==='分項能力未提供'?Infinity:order.indexOf(abilityLabel(i));


 const da=difference(a,'national'),db=difference(b,'national');


 return (rank(a)-rank(b)) || (finite(da)?da:Infinity)-(finite(db)?db:Infinity) || a.number-b.number;


}


function chooseOrder(order){


 state.mode='all';state.sort=order;


 if(order==='national'||order==='city')state.baseline=order;


 if(order==='ability')state.baseline='national';


 renderSubject();


}


function orderMarkup(subject){


 const active=state.mode==='all'?state.sort:null;


 const buttons=[['qid','1. 按照題號少至多排序'],['national','2. 按照學校減全國差距排序，最弱題在前'],['city','3. 按照學校減全縣市差距排序，最弱題在前'],['ability','4. 先按照分項能力排序，再按照學校減全國差距排序'],['wrong','5. 按照錯誤答案最高比例排序']];


 let note='題號由少至多排列。學校與全國／縣市的差距固定採學校全體；錯選比例隨下方群體選擇更新。';


 if(active==='national'||active==='city'){


   const label=active==='national'?'全國':'全縣市（臺北市）';


   note=hasCompare(subject,active)?`依「學校通過率－${label}通過率」由低至高排列，差距最負的題目排在最前面；若全為正值，優勢最小的題目在前。差距相同時依題號排列，缺少比較值的題目置末。`:`本科尚未提供${label}逐題通過率，無法計算差距；目前保留全部題目，暫依題號順序顯示。`;


 }


 if(active==='wrong')note='列出全部選擇題，依目前群體每題最多人選的錯誤選項比例由高至低排序，不設 20% 門檻，也不要求高於全國或縣市。比例相同時按題號排列；0% 仍保留，缺少資料置末。';


 if(active==='ability'){


   const missing=choices(subject).filter(i=>abilityLabel(i)==='分項能力未提供').length;


   note='先依分項能力分組，再於同一能力內依「學校通過率－全國通過率」由低至高排列，最弱題在前；差距相同時按題號排列，缺少比較值置於同組末尾。';


   if(subject.id==='chinese')note+='國文分類順序：語文知識、文意理解、文本評鑑。';


   if(missing)note+=` 本科 ${missing} 題未提供逐題分項能力對照，列於「分項能力未提供」，不以評量目標自行推定分類。`;


 }


 return `<div class="primary-orders" aria-label="五種主要排列方式">${buttons.map(([key,label])=>`<button type="button" data-order="${key}" aria-pressed="${active===key}">${label}</button>`).join('')}</div><p class="order-explanation" role="status">${esc(note)}</p>`;


}


function subjectHighlights(subject){


 const items=choices(subject),national=compareItems(subject,'national'),avg=mean(items.map(i=>i.school));


 const list=[{title:'本科逐題平均通過率',text:`${items.length} 題選擇題的學校平均通過率為 ${percent(avg)}。`+(national.length?`同題全國平均為 ${percent(mean(national.map(i=>i.national)))}，校減國平均 ${(mean(national.map(i=>difference(i,'national')))*100).toFixed(2)} ％（${national.length} 題配對）。`:'尚未提供全國與縣市逐題比較值；此平均不代表總分或跨科排名。')}];


 if(national.length){


   const first=national.slice().sort((a,b)=>difference(a,'national')-difference(b,'national')||a.number-b.number)[0],v=difference(first,'national');


   list.push({title:v<0?'與全國落差較大的題目':v>0?'相對全國優勢較小的題目':'與全國差距最小值為零',text:`第 ${first.qid} 題「${first.target}」學校通過率 ${percent(first.school)}、全國 ${percent(first.national)}，校減國 ${(v*100).toFixed(2)} ％。`});


 }else{


   const first=items.filter(i=>finite(i.school)).sort((a,b)=>a.school-b.school||a.number-b.number)[0];


   list.push({title:'校內通過率較低的題目',text:first?`第 ${first.qid} 題「${first.target}」全體通過率為 ${percent(first.school)}。這是校內作答情形，尚不能判定與全國的差距。`:'未提供可計算的通過率。'});


 }


 const wrong=items.filter(i=>wrongStats(subject,i).review).sort((a,b)=>wrongStats(subject,b).max-wrongStats(subject,a).max||a.number-b.number),first=wrong[0];


 const concentrated=wrong.filter(i=>wrongStats(subject,i).high.length).length,additional=wrong.filter(i=>wrongStats(subject,i).exception).length;


 list.push({title:`錯選重點標記：${state.group}`,text:wrong.length?`符合重點標記 ${wrong.length} 題：${concentrated} 題錯選超過 20%，另 ${additional} 題因學校高於全國或縣市至少 10 ％而標記。最高錯選為第 ${first.qid} 題 ${wrongStats(subject,first).options.join('、')}，各占 ${percent(wrongStats(subject,first).max)}（本組 ${first.groups[state.group].n} 人）。`:(subject.groups.length?'有 0 題符合本次錯選重點標記條件。':'未提供選項作答人次，無法判定錯選情形。')});


 return `<section class="subject-highlights" aria-labelledby="subject-highlights-title"><h3 id="subject-highlights-title">${esc(subject.name)}重點發現</h3><div class="highlights">${list.map(x=>`<article class="highlight"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></article>`).join('')}</div></section>`;


}


function shownItems(subject){


 let rows=choices(subject).slice();


 if(state.mode==='lag10')rows=rows.filter(i=>finite(difference(i,state.baseline))).sort((a,b)=>difference(a,state.baseline)-difference(b,state.baseline)||a.number-b.number).slice(0,10);


 if(state.mode==='gaps')rows=rows.filter(i=>finite(difference(i,state.baseline)));


 const sortKey=state.mode==='wrong'?'wrong':state.mode==='lag10'||state.mode==='gaps'?'gap':state.sort;


 rows.sort((a,b)=>{


  if(sortKey==='gap'){const da=difference(a,state.baseline),db=difference(b,state.baseline);return (finite(da)?da:Infinity)-(finite(db)?db:Infinity)||a.number-b.number;}


  if(sortKey==='national'||sortKey==='city'){const da=difference(a,sortKey),db=difference(b,sortKey);return (finite(da)?da:Infinity)-(finite(db)?db:Infinity)||a.number-b.number;}


  if(sortKey==='ability')return abilityCompare(subject,a,b);


  if(sortKey==='school')return (finite(a.school)?a.school:Infinity)-(finite(b.school)?b.school:Infinity)||a.number-b.number;


  if(sortKey==='wrong')return (wrongStats(subject,b).max??-1)-(wrongStats(subject,a).max??-1)||a.number-b.number;


  return a.number-b.number;


 });return rows;


}


function wrongReason(stats){


 const reasons=[];


 if(stats.high.length)reasons.push('錯選 >20%');


 if(stats.advantage.length&&stats.max>0)reasons.push('學校高於'+stats.advantage.map(b=>b==='national'?'全國':'臺北市').join('／')+' ≥10 ％');


 return reasons.join('；');


}


function wrongCell(subject,item){


 const value=wrongStats(subject,item);


 if(!finite(value.max))return '<span class="missing">未提供</span>';


 if(value.max===0)return `<span class="wrong-normal">無實際錯選：0／${groupData(item).n}人（0.00%）</span>`;


 return `<span class="${value.high.length?'wrong-chip':value.exception?'advantage-chip':'wrong-normal'}">${esc(value.options.join('／'))}：${value.options.length>1?'各 ':''}${groupData(item).counts[value.options[0]]}／${groupData(item).n}人（${percent(value.max)}）</span>${value.review?`<small class="wrong-reason">${esc(wrongReason(value))}</small>`:''}`;


}


function averageCell(values){const good=values.filter(finite);return `${rate(mean(good))}<small>有效 ${good.length} 題</small>`;}


function deltaAverageCell(rows,baseline){const values=rows.map(i=>difference(i,baseline)).filter(finite);return `${pp(mean(values))}<small>有效配對 ${values.length} 題</small>`;}


function summaryMarkup(subject){


 const items=choices(subject),summary=subject.summary||{},national=compareItems(subject,'national'),city=compareItems(subject,'city');


 return `<div class="summary-line"><div class="metric"><span class="label">選擇題數</span><strong class="number">${items.length}<small> 題</small></strong></div><div class="metric"><span class="label">學校逐題通過率均值（0–1）</span><strong class="number">${rate(finite(summary.meanSchool)?summary.meanSchool:mean(items.map(i=>i.school)))}</strong></div><div class="metric"><span class="label">對全國平均差距・${national.length} 題配對</span><strong class="number">${pp(mean(national.map(i=>difference(i,'national'))))}</strong></div><div class="metric"><span class="label">對臺北市平均差距・${city.length} 題配對</span><strong class="number">${pp(mean(city.map(i=>difference(i,'city'))))}</strong></div></div>`;


}


function tableMarkup(subject,rows){


 let previousAbility=null;


 const national=rows.filter(i=>finite(i.school)&&finite(i.national)),city=rows.filter(i=>finite(i.school)&&finite(i.city));


 return `<div class="table-caption"><span><strong>目前顯示 ${rows.length}／${choices(subject).length} 題</strong> · 最高錯選使用「${esc(state.group)}」群體</span><span>學校／基準：0–1；最高錯選：百分比；差距：％</span></div><div class="table-wrap"><table class="item-table"><thead><tr><th class="qid">題號</th><th class="ability-label">分項能力</th><th>來源評量目標</th><th class="numeric">全國</th><th class="numeric">臺北市</th><th class="numeric">學校全體</th><th class="numeric">校減國（％）</th><th class="numeric">校減臺北（％）</th><th class="numeric">最高錯選（${esc(state.group)}）</th><th>詳情</th></tr></thead><tbody>${rows.length?rows.map(item=>{const ability=abilityLabel(item),divider=state.sort==='ability'&&state.mode!=='lag10'&&state.mode!=='gaps'&&ability!==previousAbility?`<tr class="ability-divider"><td colspan="10">${esc(ability)}<small>同組按學校減全國差距由低至高排列</small></td></tr>`:'';previousAbility=ability;return `${divider}<tr><td class="qid">${esc(item.qid)}</td><td class="ability-label">${esc(ability)}</td><td class="target">${esc(item.target||'來源未提供評量目標')}${item.basis?`<small>${esc(item.basis)}</small>`:''}</td><td class="numeric">${rate(item.national)}</td><td class="numeric">${rate(item.city)}</td><td class="numeric">${rate(item.school)}</td><td class="numeric">${pp(difference(item,'national'))}</td><td class="numeric">${pp(difference(item,'city'))}</td><td class="numeric">${wrongCell(subject,item)}</td><td class="detail-cell"><button class="btn detail-button" type="button" data-detail="${esc(item.qid)}" aria-label="查看第 ${esc(item.qid)} 題詳情">查看</button></td></tr>`;}).join(''):'<tr><td colspan="10" class="empty">此篩選條件下沒有題目。</td></tr>'}</tbody><tfoot><tr class="footer-average"><td colspan="3">目前顯示題目平均<small>各欄列出有效題數；比較欄使用有效配對</small></td><td class="numeric">${averageCell(national.map(i=>i.national))}</td><td class="numeric">${averageCell(city.map(i=>i.city))}</td><td class="numeric">${averageCell(rows.map(i=>i.school))}</td><td class="numeric">${deltaAverageCell(rows,'national')}</td><td class="numeric">${deltaAverageCell(rows,'city')}</td><td class="numeric">—<small>不平均錯選率</small></td><td></td></tr></tfoot></table></div><p class="table-footnote">全國／臺北市平均僅使用同題學校與該基準皆有效的配對；學校欄使用目前顯示且有學校通過率的題目。差距 = 學校全體通過率 − 比較基準，不將所選等級群體直接與全國全體比較。最高錯選比例＝該錯誤選項人數÷本組有效人數。負值表示學校全體低於基準。選項百分比以該群體人數為分母，包含未作答與複選；${subject.id==='listening'?'聽力以 A、B、C 為實際選項，來源 D 欄紀錄另列於詳情，不納入最高錯選及錯選檢視篩選。':'錯誤選項嚴格大於 20% 標示集中錯選。這是本網頁教學標記，並非官方認定門檻。'} 若學校全體通過率高於全國或臺北市任一基準至少 10 ％，該題本組有實際錯選時另標示最高錯選選項（可 ≤20%）。缺少比較值不套用例外，「最多錯誤選項檢視」仍列出全部選擇題（含 0%），不受上述標記條件限制。</p>`;


}


function gapMarkup(subject){


 const rows=compareItems(subject).filter(i=>difference(i,state.baseline)<0).sort((a,b)=>difference(a,state.baseline)-difference(b,state.baseline)||a.number-b.number).slice(0,10);


 if(!rows.length)return '<div class="notice">尚未提供近三年分項能力通過率報告，無法比較113至115年變化。</div>';


 const max=Math.max(...rows.map(i=>-difference(i,state.baseline)));


 return `<div class="panel lower-panel gap-panel"><h3>相對${baselineName()}落後前 ${rows.length} 題</h3><p class="muted small">按差距由小至大。條長表示落後幅度，共用尺度 0–${(max*100).toFixed(2)} ％。</p><div class="gap-chart">${rows.map(item=>`<div class="gap-row"><span>第 ${esc(item.qid)} 題</span><div class="gap-track" aria-hidden="true"><span style="width:${-difference(item,state.baseline)/max*100}%"></span></div><span class="gap-value">${(difference(item,state.baseline)*100).toFixed(2)} ％</span></div>`).join('')}</div></div>`;


}


function constructedMarkup(subject){


 const items=(subject.items||[]).filter(i=>i.kind==='constructed');if(!items.length)return '';


 return `<section class="panel lower-panel"><h3>數學非選擇題：分數分布</h3><p class="muted small">每題滿分 3 分。下列率值是平均得分，與選擇題通過率不同。來源 A／B／C／D 欄依序代表 0／1／2／3 分；未作答另列，計算分母仍包含未作答人數。</p><div class="constructed-grid">${items.map(item=>`<article class="constructed-card"><h3>第 ${esc(item.qid)} 題<button class="btn detail-button" data-detail="${esc(item.qid)}" type="button">查看題目</button></h3><p>${esc(item.target||'來源未提供評量目標')}</p><div class="table-wrap"><table><thead><tr><th>群體</th><th class="numeric">人數</th><th class="numeric">0 分</th><th class="numeric">1 分</th><th class="numeric">2 分</th><th class="numeric">3 分</th><th class="numeric">未答</th><th class="numeric">平均得分</th></tr></thead><tbody>${(subject.groups||[]).map(group=>{const g=item.groups?.[group.name];return `<tr><td>${esc(group.name)}</td><td class="numeric">${g?.n??'—'}</td>${['A','B','C','D','blank'].map(k=>`<td class="numeric">${g?.counts?.[k]??'—'}</td>`).join('')}<td class="numeric">${rate(g?.rate)}</td></tr>`;}).join('')}</tbody></table></div></article>`).join('')}</div></section>`;


}


function targetMarkup(subject){


 const grouped=new Map();choices(subject).forEach(item=>{const key=item.target||'未提供評量目標';if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(item);});


 return `<details class="collapsible"><summary>評量目標彙整（依來源文字分組）</summary><div class="collapsible-content"><p class="muted small">將評量目標文字完全相同的選擇題分組，計算逐題通過率平均。這是由逐題資料彙整的教學參考，不是官方分項成績；題數少的類別不宜過度推論。</p></div><div class="table-wrap"><table class="target-table"><thead><tr><th>評量目標</th><th class="numeric">題數</th><th class="numeric">學校平均（0–1）</th><th class="numeric">對全國平均差距</th><th class="numeric">對臺北市平均差距</th></tr></thead><tbody>${Array.from(grouped.entries()).map(([target,items])=>`<tr><td>${esc(target)}</td><td class="numeric">${items.length}</td><td class="numeric">${averageCell(items.map(i=>i.school))}</td><td class="numeric">${deltaAverageCell(items,'national')}</td><td class="numeric">${deltaAverageCell(items,'city')}</td></tr>`).join('')}</tbody></table></div></details>`;


}


function renderSubject(){


 const subject=current();if(!subject){document.getElementById('subject-content').innerHTML='<p class="empty">沒有可讀取的科目資料。</p>';return;}


 document.getElementById('history-content').innerHTML=historyMarkup(subject);


 const rows=shownItems(subject),compare=hasCompare(subject,state.baseline),groups=subject.groups||[];


 const totalN=groups.find(g=>g.name==='全體')?.n;


 const groupShare=g=>finite(totalN)&&totalN>0&&finite(g.n)?percent(g.n/totalN):'比例未提供';


 document.getElementById('subject-content').innerHTML=`<div class="panel"><div class="panel-head"><div class="subject-title-row"><div><h2>${esc(subject.name)}｜逐題分析</h2><p class="subject-source">來源：${esc(sourceName(subject))}</p></div><button class="btn" id="print-subject" type="button">列印本科</button></div><div class="groups">${groups.map(g=>`<span class="group-pill">${esc(g.name)}<strong class="number">${finite(g.n)?g.n:'—'}<em>人</em></strong><span class="group-share number" title="${esc(g.name)}人數 ÷ 全體人數 ${finite(totalN)?totalN:'未提供'}">${groupShare(g)}</span></span>`).join('')}</div><p class="small muted group-denominator">等級比例＝該等級人數÷本科全體有效人數（${finite(totalN)?totalN:'未提供'}人）；全體不含缺考及重大違規。${subject.id==='listening'?'聽力僅分基礎、待加強，不設精熟等級。':''}</p><p class="print-only print-note">本頁依目前篩選與排序列印。最高錯選使用「${esc(state.group)}」群體；率值顯示四位小數，差距單位為％。</p></div>${subjectHighlights(subject)}${summaryMarkup(subject)}${orderMarkup(subject)}<div class="controls"><label class="control">錯選分析群體<select id="group-control">${(subject.id==='listening'?['全體','基礎','待加強']:['全體','精熟','基礎','待加強']).map(name=>`<option value="${name}" ${state.group===name?'selected':''} ${groups.some(g=>g.name===name)?'':'disabled'}>${name}${groups.some(g=>g.name===name)?'':'（未提供）'}</option>`).join('')}</select></label></div>${tableMarkup(subject,rows)}${(subject.notes||[]).length?`<ul class="subject-notes">${subject.notes.map(note=>`<li>${esc(note)}</li>`).join('')}</ul>`:''}</div>${constructedMarkup(subject)}`;


 document.querySelectorAll('[data-order]').forEach(b=>b.addEventListener('click',()=>chooseOrder(b.dataset.order)));


 document.getElementById('group-control').addEventListener('change',event=>{state.group=event.target.value;renderSubject();});


 document.getElementById('print-subject').addEventListener('click',printSubject);


 document.querySelectorAll('[data-detail]').forEach(button=>button.addEventListener('click',()=>showDetail(button.dataset.detail)));


}


function optionCell(group,key,answer,constructed,listening,reviewStats){


 const count=group?.counts?.[key],proportion=finite(count)&&finite(group?.n)&&group.n>0?count/group.n:null;


 let cls='';


 if(listening&&key==='D')cls='record-only';


 else if(!constructed&&key===answer)cls='correct';


 else if(!constructed&&['A','B','C','D'].includes(key)&&key!==answer&&finite(proportion)&&proportion>0.2)cls='high-wrong';


 else if(!constructed&&reviewStats?.exception&&reviewStats.options.includes(key))cls='advantage-wrong';


 return `<td class="${cls}">${finite(count)?count:'—'}<small>${percent(proportion)}</small></td>`;


}




function teachingForQuestion(subject,item){

 const constructed=item.kind==='constructed',group=item.groups?.['全體'];

 const formatGap=b=>{const value=difference(item,b);return finite(value)?`${b==='national'?'校減全國':'校減臺北市'} ${(value*100).toFixed(2)}％`:`${b==='national'?'全國':'臺北市'}比較資料未提供`};

 let fact;

 if(constructed){

  const counts=group?.counts;

  fact=`學校全體平均得分${finite(item.school)?item.school.toFixed(4)+'分（滿分3分）':'未提供'}。`+

   (counts?['A','B','C','D'].map((k,i)=>`${i}分：${finite(counts[k])?counts[k]+'人':'未提供'}`).join('；')+'。':'得分分布未提供。');

 }else{

  const w=wrongStats(subject,item,'全體');

  fact=`全體通過率${percent(item.school)}；`+(w.options.length?`最高錯選${w.options.join('、')}，各占${percent(w.max)}`:finite(w.max)?'未有實際錯選':'錯選資料未提供')+`；${formatGap('national')}；${formatGap('city')}。`;

 }

 const focus=item.target||item.basis||'本題對應能力';

 const fallback={

  fact,

  hypothesis:constructed?`得分分布可作為檢視「${focus}」的線索。需查看學生的計算、推理與表達步驟，才能區分觀念理解、運算或書寫上的困難。`:`選項分布可作為檢視「${focus}」的線索；尚不能單由選答判定錯誤原因。`,

  action:constructed?'請學生逐步說明解題策略，依評分規準對照完整與部分給分作答；針對缺漏步驟示範修正，再以同能力短題確認理解。':

   subject.id==='listening'?'重播本題對應音檔，請學生說明聽到的關鍵訊息並對照選項；確認誤聽或語意理解的可能問題，再以相近情境檢核。':

   subject.id==='math'?'請學生呈現解題步驟，對照正答與主要錯選，檢查概念、運算及題意理解；再以同分項能力短題檢核。':

   '請學生口述解題依據，對照正答與主要錯選，標出題目或題組中的證據；以同評量目標的短題再次檢查理解。'

 };

 return {fact:item.teaching?.fact||fallback.fact,hypothesis:item.teaching?.hypothesis||fallback.hypothesis,action:item.teaching?.action||fallback.action};

}

function showDetail(qid){


 const subject=current(),item=subject.items.find(i=>i.qid===qid);if(!item)return;


 const constructed=item.kind==='constructed',listening=subject.id==='listening';

 const teaching=teachingForQuestion(subject,item);


 document.getElementById('dialog-eyebrow').textContent=subject.name+' · '+(constructed?'非選擇題':'選擇題');


 document.getElementById('dialog-title').textContent='第 '+item.qid+' 題';


 const keys=constructed?['A','B','C','D','blank','multiple']:listening?['A','B','C','blank','multiple']:['A','B','C','D','blank','multiple'];


 const labels=key=>constructed?({A:'0 分',B:'1 分',C:'2 分',D:'3 分',blank:'未作答',multiple:'複選紀錄'}[key]):({D:listening?'來源 D 欄紀錄':'D',blank:'未作答',multiple:'複選'}[key]||key);


 document.getElementById('dialog-body').innerHTML=`<section class="detail-section question-first"><h3>題目與選項</h3><div class="collapsible-content">${item.doc?`<p class="doc-source">${esc(item.doc.note||'來源：隨附 DOCX 題目資料')}</p><div class="doc-fragment" id="doc-fragment"></div>`:'<p class="muted small">未提供可對應的原始題目內容；本題分析僅使用試題分析表。</p>'}</div></section><div class="detail-meta"><div class="meta-box"><span class="label">${constructed?'評分範圍':'正確答案'}</span><strong>${constructed?'0–3 分':esc(item.answer||'來源未提供')}</strong></div><div class="meta-box"><span class="label">${constructed?'學校平均得分（滿分 3）':'學校通過率（0–1）'}</span><strong class="number">${rate(item.school)}</strong></div><div class="meta-box wide"><span class="label">來源評量目標</span>${esc(item.target||'未提供')}</div>${item.basis?`<div class="meta-box wide"><span class="label">來源評量依據</span>${esc(item.basis)}</div>`:''}</div><section class="detail-section"><h3>${constructed?'各群體得分分布':'各群體選項分布'}</h3><p class="small muted">每格上列為人次，下列為占該群體人數的百分比。${constructed?'平均得分以全部群體人數為分母，包含未作答。':'分母包含未作答、複選與來源紀錄的其他作答。'}</p>${constructed?'':`<div class="legend"><span class="correct-key">正確選項</span><span class="wrong-key">錯誤選項 >20%</span><span class="advantage-key">學校高於基準 ≥10 ％的最高錯選（≤20%）</span></div>`}<div class="table-wrap"><table class="option-table"><thead><tr><th>群體</th><th>人數</th>${keys.map(k=>`<th>${esc(labels(k))}</th>`).join('')}<th>${constructed?'平均得分':'通過率（0–1）'}</th></tr></thead><tbody>${(subject.groups||[]).map(group=>{const g=item.groups?.[group.name];return `<tr><td>${esc(group.name)}</td><td>${finite(g?.n)?g.n:'—'}</td>${keys.map(k=>optionCell(g,k,item.answer,constructed,listening,constructed?null:wrongStats(subject,item,group.name))).join('')}<td>${rate(g?.rate)}</td></tr>`;}).join('')}</tbody></table></div>${listening?'<div class="notice">英文聽力只有 A、B、C 三個選項，能力等級分為基礎、待加強。全體為合計群體，並非另一個等級；各選項比例以該群體人數為分母。</div>':''}${constructed?'<div class="notice">來源 A／B／C／D 欄依序對應 0／1／2／3 分。平均得分 =（1 分人數 + 2 × 2 分人數 + 3 × 3 分人數）÷ 群體人數，並非答對比例。</div>':''}${constructed?'':`<div class="notice">錯選重點標記採兩個條件擇一（不作為全部題目排序的篩選門檻）：本組單一錯誤選項 >20%；或學校全體通過率高於全國／臺北市任一基準至少 10 ％，且本組有實際錯選。後者即使最高錯選 ≤20% 也另外標示，不稱為集中錯選。20%與10％為本網頁教學標記，並非官方判定標準；錯選原因仍需搭配學生說明確認。<br>${['national','city'].filter(b=>finite(difference(item,b))).map(b=>`校減${b==='national'?'全國':'臺北市'}：${(difference(item,b)*100).toFixed(2)} ％`).join('；')||'本題未提供外部比較值，無法套用高於基準的例外。'}</div>`}</section>${teaching?`<section class="detail-section"><h3>教學檢視</h3><div class="teaching-grid"><div class="teaching-box"><h4>數據事實</h4><p>${esc(teaching.fact||'未提供')}</p></div><div class="teaching-box"><h4>待驗證的可能原因</h4><p>${esc(teaching.hypothesis||'需搭配作答歷程確認。')}</p></div><div class="teaching-box"><h4>教學行動建議</h4><p>${esc(teaching.action||'未提供')}</p></div></div></section>`:''}`;


 if(item.doc?.html)document.getElementById('doc-fragment').innerHTML=item.doc.html;


 const dialog=document.getElementById('item-dialog');dialog.showModal();dialog.scrollTop=0;


}


function trendChange(row,year){


 const now=row.years.find(x=>x.year===115).gap,old=row.years.find(x=>x.year===year).gap;


 const delta=now-old,amount=(Math.abs(delta)*100).toFixed(0);


 if(Math.abs(delta)<1e-9)return '差距持平';


 if(now<=0&&old<=0)return `落差${delta>0?'縮小':'擴大'} ${amount} ％（${delta>0?'變強':'變弱'}）`;


 if(now>=0&&old>=0)return `優勢${delta>0?'擴大':'縮小'} ${amount} ％`;


 return `由${old<0?'落後轉為領先':'領先轉為落後'}（差距${delta>0?'增加':'減少'} ${amount} ％）`;


}


function historyMarkup(subject){


 const rows=subject.abilityHistory||[];


 if(!rows.length)return '<div class="notice">尚未提供近三年分項能力通過率報告，無法比較113至115年變化。</div>';


 return `<section class="panel lower-panel ability-history" aria-labelledby="history-title"><h3 id="history-title">${esc(subject.name)}｜近三年分項能力比較</h3><p class="small muted">來源：各科分項能力通過率分析。依官方分項能力報告呈現，不以本頁逐題均值替代。</p><div class="table-wrap"><table class="history-table"><thead><tr><th>分項能力</th>${[113,114,115].map(y=>`<th>${y} 年</th>`).join('')}<th>115 年較 114 年</th><th>115 年較 113 年</th></tr></thead><tbody>${rows.map(r=>`<tr><th scope="row">${esc(r.ability)}</th>${r.years.map(y=>`<td><div>學校 <strong>${(y.school*100).toFixed(0)}%</strong></div><div>全國 ${(y.national*100).toFixed(0)}%</div><div>校減國 ${pp(y.gap)}</div></td>`).join('')}<td>${trendChange(r,114)}</td><td>${trendChange(r,113)}</td></tr>`).join('')}</tbody></table></div><p class="small muted history-note">各年為不同屆學生、不同試題；差距變化描述相對全國的位置，不能視為同一批學生的進步或退步。來源通過率保留兩位小數，差距及變化以來源精度計算。</p></section>`;


}


function renderGrades(){document.getElementById('grade-overview').innerHTML='<h2>五科精熟、基礎、待加強等級比較</h2><div class="notice">尚未提供五科學生成績報告與臺北市等級比例，無法完成五科比較。國文作答有效群體共187人：精熟29人（15.51%）、基礎127人（67.91%）、待加強31人（16.58%）。其餘科目未提供，不由逐題通過率推算。</div>';}


function renderMethods(){


 const issues=(DATA.issues||[]).filter(issue=>!(issue.subject==='英文聽力'&&issue.field==='來源D欄紀錄'));


 document.getElementById('methods').innerHTML=`<details class="collapsible"><summary>來源與分析方法</summary><div class="collapsible-content"><section class="guide-summary" aria-labelledby="guide-summary-title" style="margin-bottom:24px"><h3 id="guide-summary-title">《國中教育會考學力品質監控資料【國民中學版】使用說明》摘要</h3><p class="small muted" style="margin-top:6px">依心測中心國民中學版資料定義整理。四類資料由整體學力、分項能力、逐題通過率到選項反應，協助教師找出學習優勢與弱點，作為調整教學的參考。</p><ul><li><strong>學生成績報告：</strong>提供學校基本資料、各科各等級人數百分比與表現描述；比較學校、全國與所在縣市的學力狀況。本網頁對應「五科精熟、基礎、待加強等級比較」。</li><li><strong>各科分項能力通過率分析：</strong>提供近三年學校與全國各分項能力通過率，以全國平均為參照觀察變化。若某能力低於全國且差距逐年擴大，可列為優先補強方向。本網頁對應「五科近三年分項能力比較」。</li><li><strong>各科試題通過率分析：</strong>提供每題的分項能力、評量目標及學校、縣市、全國通過率，供教師篩選需討論的題目。使用說明舉例可篩選學校通過率低於 0.5（50%），或低於縣市通過率的題目；這些是篩選示例，不是統一判定標準。本網頁以逐題差距及分項能力排序支援檢視。</li><li><strong>各科試題分析：</strong>提供完整試題、評量目標、命題依據、通過率、鑑別度及各選項選答人次。教師可比較全體與不同程度群體的作答，從低通過率題目的選項分布探討可能的迷思概念，並調整教學。本網頁對應逐題「查看」詳情。</li></ul><p class="small muted">本次提供六科比較Excel與國文Word；其餘來源尚未提供。</p><div class="notice"><strong>本網頁補充判讀：</strong>不同年度為不同屆學生及試題，跨年差距不能視為同一批學生的成長；錯選只能提供待確認的線索，需搭配作答說明與課堂觀察。英文聽力僅有 A、B、C 選項及基礎、待加強兩等級。「錯選 &gt;20%」等醒目標記為本網頁設定，並非使用說明所訂門檻。</div></section><div class="method-columns"><div><h3>計算與判讀</h3><ul><li>選擇題通過率以來源資料為準；表中率值使用 0–1，顯示四位小數。</li><li>選擇題逐題均值採有效題目算術平均，不換算為測驗總分。</li><li>差距以同題有效配對計算：100 ×（學校通過率 − 比較基準通過率），單位為％。</li><li>「最多錯誤選項檢視」列出全部選擇題，按本組每題最高錯選率由高至低排列，含低於 20% 與 0% 的題目；缺少資料置末。錯選重點標記符合任一條件即標示：① 本組單一錯誤選項人次 ÷ 本組人數 >20%；② 學校全體通過率－全國或縣市通過率 ≥0.10，且本組有實際錯選。第二種情況標示最高錯選，不要求 >20%。</li><li>「高出10%」依通過率相減解讀為至少10％，例如80%－70%=10％；全國、縣市任一符合即可，不受檢視基準選單影響。正答、未作答、複選與非實際選項不納入錯選條件。</li><li>未作答與複選另列紀錄；英文聽力僅呈現 A、B、C 三個選項，等級僅分基礎、待加強。</li><li>數學非選擇題以平均得分與分數分布獨立呈現，不混入通過率均值。</li></ul></div><div><h3>資料限制與判讀邊界</h3><ul>${(DATA.limitations||[]).map(note=>`<li>${esc(note)}</li>`).join('')}</ul></div></div></div><div class="table-wrap"><table class="sources-table"><thead><tr><th>來源檔案</th><th>用途</th></tr></thead><tbody>${(DATA.sources||[]).map(source=>`<tr><td>${esc(source.name)}</td><td>${esc(source.role)}</td></tr>`).join('')}</tbody></table></div></details><details class="collapsible"><summary>資料核對與例外記錄（${issues.length} 項）</summary><div class="collapsible-content"><h3>核對結果</h3><ul>${(DATA.verification||[]).map(note=>`<li>${esc(note.replaceAll('30%','20%'))}</li>`).join('')}<li>英文聽力僅有 A、B、C 三個選項，能力等級為基礎、待加強；來源 D 欄不列為本報告的資料例外。</li></ul>${!issues.length?'<p class="small muted">未列出需另行註記的資料例外。</p>':''}</div>${issues.length?`<div class="table-wrap"><table class="issues-table"><thead><tr><th>科目</th><th>題號</th><th>欄位</th><th>核對說明</th></tr></thead><tbody>${issues.map(issue=>`<tr><td>${esc(issue.subject)}</td><td>${esc(issue.qid||'—')}</td><td>${esc(issue.field)}</td><td>${esc(issue.message)}</td></tr>`).join('')}</tbody></table></div>`:''}</details>`;


}

document.title=reportTitle;

render();renderMethods();renderGrades();
